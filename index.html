<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only"><meta name="theme-color" content="#17A89B"><title>KOSLING</title>
<style>
:root{color-scheme:light;--t:#0E9384;--td:#0A6F64;--tl:#E8F6F4;--bg:#F6F8F8;--cd:#fff;--tx:#14201F;--mu:#667573;--bd:#E2E8E7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding:env(safe-area-inset-top) 0 96px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.top{position:sticky;top:0;z-index:4;background:#fff;padding:12px 16px;border-bottom:1px solid var(--bd)}
.top small{display:block;color:var(--mu)}.ttl{font-size:18px;font-weight:700}
.brand{font-weight:800;font-size:20px;letter-spacing:.6px;color:var(--td)}.brand span{color:var(--t)}
.locbar{margin-top:10px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:12px;color:var(--td)}
.ll1{font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:0 12px;color:var(--mu)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;padding:11px 0;color:var(--tx)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--td);font-weight:600;padding:0 0 6px}
.pad{padding:16px}h2{font-size:15px;font-weight:700;margin:20px 0 8px}
.promo{display:flex;gap:12px;align-items:center;background:var(--tl);border-radius:14px;padding:14px}.promo b{color:var(--td)}.promo p{margin:2px 0 0;font-size:12px;color:var(--mu)}
.btn{height:42px;padding:0 16px;border:0;border-radius:12px;background:var(--t);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}.btn:hover{background:var(--td)}
.btn.o{background:#fff;color:var(--td);border:1px solid var(--t)}.btn.o:hover{background:var(--tl)}.btn.w{background:#fff;color:var(--td);border:1px solid var(--bd)}
.btn.s{height:34px;padding:0 12px;font-size:12px;border-radius:10px}
.lnk{background:none;border:0;color:var(--td);text-decoration:underline;padding:10px 0;width:100%}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px}.chip{flex:none;border:1px solid var(--bd);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px}.chip.on{background:var(--td);color:#fff;border-color:var(--td)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.card{position:relative;background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05)}.card .b{padding:10px 12px}.nm{font-weight:600;line-height:1.3}
.card:not(.fe) .img{height:auto!important;aspect-ratio:4/3}
.card.fe{grid-column:1/-1;border:1.5px solid var(--t);box-shadow:0 6px 18px rgba(14,147,132,.18)}.card.fe .img{height:170px!important}
.pr{position:absolute;top:8px;left:8px;z-index:1;display:inline-flex;align-items:center;gap:4px;background:var(--td);color:#fff;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600}
.hb{position:absolute;top:8px;right:8px;z-index:1;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:#fff;color:#D9466F;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.img{background:var(--tl);color:#7CC4BC;display:flex;align-items:center;justify-content:center;overflow:hidden}.img img{width:100%;height:100%;object-fit:cover}
.gal{display:flex;gap:6px;overflow-x:auto}.gal img,.gal .img{height:220px;flex:none;max-width:100%}.gal img{width:auto}
.price{color:var(--td);font-weight:700;font-size:15px}.mu{color:var(--mu);font-size:12px}
.tag{display:inline-block;background:var(--tl);color:var(--td);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;margin:2px 4px 2px 0}
.fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 199px));display:inline-flex;align-items:center;gap:6px;background:var(--td);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 6px 16px rgba(10,111,100,.35);z-index:5}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:#fff;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--mu);font-weight:500}.nav button.on{color:var(--td);font-weight:700;box-shadow:inset 0 2px 0 var(--t)}
.ni{position:relative;display:inline-block;line-height:0}.bg{position:absolute;top:-6px;right:-10px;background:#D9466F;color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:16px;height:16px;line-height:16px;padding:0 4px;text-align:center}
.row{display:flex;align-items:center;gap:10px}.box{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-top:10px;background:#fff}
.av{width:38px;height:38px;flex:none;border-radius:50%;background:var(--t);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}.av.sm{width:32px;height:32px;font-size:13px}
label{display:block;font-size:12px;color:var(--mu);margin:14px 0 4px;font-weight:600}label.opt{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx);margin:8px 0;font-weight:400}
.f{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff}.f:focus{border-color:var(--t);box-shadow:0 0 0 3px rgba(14,147,132,.15);outline:0}
.err{color:#C0392B;font-size:12px;min-height:18px;margin-top:6px}
.step{display:inline-block;border:1px solid var(--bd);border-radius:999px;padding:2px 10px;font-size:11px;margin:6px 4px 0 0;color:var(--mu)}.step.on{background:var(--t);border-color:var(--t);color:#fff}
.msg{max-width:80%;padding:8px 14px;border-radius:16px;margin:6px 0;background:#fff;border:1px solid var(--bd)}.msg.me{background:var(--t);border-color:var(--t);color:#fff;margin-left:auto}
.th{position:relative;display:inline-block;margin:6px 6px 0 0}.th img{width:64px;height:64px;object-fit:cover;border-radius:10px}.th button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#C0392B;color:#fff;font-size:12px;line-height:1}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14201F;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:9}#toast.show{opacity:1}
</style></head><body>
<div id="app"></div><div id="toast" role="status"></div><nav class="nav" id="nv" aria-label="Menu utama"></nav>
<script>
const $=id=>document.getElementById(id),app=$("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',heart:'<path d="M12 21s-7-4.4-9.3-9C1.2 8.6 3 5 6.5 5c2 0 3.5 1.1 5.5 3 2-1.9 3.5-3 5.5-3C21 5 22.8 8.6 21.3 12 19 16.6 12 21 12 21z"/>',cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.4 12.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 7H6"/>',chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',pin:'<path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',back:'<path d="M15 5l-7 7 7 7"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',bed:'<path d="M3 18V6M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.5"/>',chair:'<path d="M7 3h10v8H7zM5 11h14v3H5zM7 14v7M17 14v7"/>',fan:'<circle cx="12" cy="10" r="7"/><circle cx="12" cy="10" r="1.5"/><path d="M12 17v4M8 21h8"/>',shelf:'<path d="M5 3h14v18H5zM5 9h14M5 15h14"/>',plug:'<path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/>',box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>'};
const CI={Kasur:"bed",Meja:"chair",Kipas:"fan",Rak:"shelf",Elektronik:"plug",Lainnya:"box"};
const ic=(n,z=20,f=0)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="${f?"currentColor":"none"}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none">${P[n]||""}</svg>`;
const rp=n=>"Rp"+Number(n).toLocaleString("id-ID"),fd=m=>m<1000?m+" m":(m/1000).toFixed(1).replace(".",",")+" km";
const CAT=["Semua","Kasur","Meja","Kipas","Rak","Elektronik","Lainnya"],EM={Kasur:"",Meja:"",Kipas:"",Rak:"",Elektronik:"",Lainnya:""};
const KD=["Baru","Seperti baru","Baik","Cukup","Perlu perbaikan"],DLV={pickup:"Diambil sendiri",ship:"Dikirim",both:"Diambil sendiri atau dikirim"},ST=["Disiapkan","Dikirimkan","Diterima"];
const SF=.1,PROMO=10000,PICK=.05;
const shipCost=km=>Math.max(20000,Math.round((20000+Math.max(0,km-5)*2500)/1000)*1000);
const isF=i=>i.feat>Date.now();
const seed=[[1,"Kasur busa single","Kasur","Baik",250000,1,"Busa tebal 90x200, sarung baru dicuci, tanpa noda.","Tembalang, Semarang",-7.0552,110.4372,"both","Rani A."],[2,"Kipas angin berdiri","Kipas","Seperti baru",90000,1,"Tiga kecepatan, putaran halus, dipakai 6 bulan.","Tembalang, Semarang",-7.051,110.438,"both","Dimas P."],[3,"Meja belajar lipat","Meja","Baru",75000,0,"Belum pernah dipakai, masih dalam plastik.","Tembalang, Semarang",-7.05,110.44,"pickup","Salsa N."],[4,"Rak buku 4 susun","Rak","Cukup",120000,1,"Ada goresan kecil, rangka kokoh.","Banyumanik, Semarang",-7.066,110.4265,"ship","Yoga W."],[5,"Rice cooker mini","Elektronik","Baik",65000,0,"Fungsi normal, kapasitas 0,6 liter.","Banyumanik, Semarang",-7.062,110.425,"both","Nabila F."],[6,"Kursi plastik","Meja","Perlu perbaikan",25000,1,"Salah satu kaki longgar, cocok untuk yang bisa memperbaiki.","Tembalang, Semarang",-7.056,110.435,"pickup","Rafi H."]].map(a=>({id:a[0],n:a[1],c:a[2],k:a[3],p:a[4],neg:a[5],d:a[6],lb:a[7],la:a[8],lo:a[9],dl:a[10],sn:a[11],s:"seed",ph:[]}));seed[0].feat=Date.now()+4*864e5;
const S={v:"home",user:null,users:[],items:seed,wish:[],cart:[],orders:[],chats:{},compl:[],loc:{la:-6.9932,lo:110.4203,lb:"Semarang (belum diatur)"},sl:null,man:false,rev:[],pr:null,sort:"near",cat:"Semua",kond:"Semua",q:"",sel:null,ch:null,cr:null,photos:[],vid:null,am:"login",co:{dm:"pickup",pay:"cod",addr:""}};
try{const sv=JSON.parse(localStorage.getItem("kosling4")||"null");if(sv)Object.assign(S,sv)}catch(e){}
function save(){try{const o={};["user","users","items","wish","cart","orders","chats","compl","loc","rev"].forEach(k=>o[k]=S[k]);localStorage.setItem("kosling4",JSON.stringify(o,(k,v)=>k==="vid"?undefined:v))}catch(e){toast("Penyimpanan penuh, sebagian data mungkin tidak tersimpan")}}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2200)}
const item=id=>S.items.find(x=>x.id===id);
function dm(i){if(i.la==null)return 0;const a=i.la,b=i.lo,r=Math.PI/180,x=(a-S.loc.la)*r,y=(b-S.loc.lo)*r,q=Math.sin(x/2)**2+Math.cos(S.loc.la*r)*Math.cos(a*r)*Math.sin(y/2)**2;return Math.round(12742000*Math.asin(Math.sqrt(q)))}
const opt=(a,v)=>a.map(x=>{const[p,q]=Array.isArray(x)?x:[x,x];return`<option value="${p}"${p===v?" selected":""}>${q}</option>`}).join("");
const radio=(n,o,v)=>o.map(x=>`<label class="opt"><input type="radio" name="${n}" value="${x[0]}" data-r="${n}"${x[0]===v?" checked":""}> ${x[1]}</label>`).join("");
const hd=(t,s,b)=>`<div class="top">${b?`<button class="back" data-a="go" data-v="${b}">${ic("back",16)} Kembali</button>`:""}<b class="ttl">${t}</b>${s?`<small>${s}</small>`:""}</div>`;
const pic=(i,h)=>`<div class="img" style="height:${h}px">${i.ph&&i.ph[0]?`<img src="${i.ph[0]}" alt="">`:`${ic(CI[i.c]||"box",40)}`}</div>`;
function vis(){const l=S.items.filter(i=>!i.sold&&(S.cat==="Semua"||i.c===S.cat)&&(S.kond==="Semua"||i.k===S.kond)&&(i.n+" "+i.lb+" "+i.d).toLowerCase().includes(S.q.toLowerCase()));l.forEach(i=>i._d=dm(i));l.sort((a,b)=>S.sort==="lo"?a.p-b.p:S.sort==="hi"?b.p-a.p:a._d-b._d);return l.sort((a,b)=>isF(b)-isF(a))}
const card=i=>{const f=isF(i);return`<div class="card${f?" fe":""}" data-a="open" data-id="${i.id}"><button class="hb" data-a="fav" data-id="${i.id}" aria-label="Favorit">${ic("heart",18,S.wish.includes(i.id))}</button>${f?`<span class="pr">${ic("bolt",11,1)} Promo</span>`:""}${pic(i,f?150:96)}<div class="b"><div class="nm">${esc(i.n)}</div><div class="price">${rp(i.p)}</div><div class="mu">${ic("pin",12)} ${fd(i._d??dm(i))} · ${esc(i.lb)}</div><div><span class="tag">${esc(i.k)}</span>${i.neg?`<span class="tag">Bisa nego</span>`:""}</div></div></div>`};
const lst=()=>{const l=vis();return l.length?l.map(card).join(""):`<p class="mu" style="grid-column:1/-1">Tidak ada barang yang cocok.</p>`};
const V={};
V.home=()=>`<div class="top"><div class="row" style="justify-content:space-between"><div class="brand">KOS<span>LING</span></div>${S.user?`<div class="av sm" aria-label="Akun">${esc(S.user.name[0])}</div>`:`<button class="btn s" data-a="go" data-v="me">Masuk</button>`}</div><div class="locbar"><div class="row" style="flex:1;min-width:0;gap:8px">${ic("pin",18)}<div style="min-width:0"><div class="mu">Lokasi pencarian</div><div class="ll1">${esc(S.loc.lb)}</div></div></div><button class="btn w s" data-a="gps">GPS</button><button class="btn w s" data-a="man">Manual</button></div>${S.man?`<div class="row" style="margin-top:10px"><input class="f" id="ml" placeholder="Alamat, kawasan, atau koordinat" aria-label="Lokasi manual"><button class="btn s" data-a="geo">Cari</button></div>`:""}<div class="search">${ic("search",18)}<input id="q" placeholder="Cari barang di sekitarmu" value="${esc(S.q)}" aria-label="Cari"></div></div><div class="pad"><div class="promo"><div style="flex:1"><b>Mau pindah kos?</b><p>Jual cepat sebelum pulang, pembeli sekitar siap ambil.</p></div><button class="btn s" data-a="sell">Jual barang</button></div><div class="filters"><select class="f" id="so" aria-label="Urutkan">${opt([["near","Terdekat"],["lo","Termurah ke termahal"],["hi","Termahal ke termurah"]],S.sort)}</select><select class="f" id="kd" aria-label="Kondisi">${opt(["Semua",...KD],S.kond)}</select></div><div class="chips">${CAT.map(c=>`<button class="chip${c===S.cat?" on":""}" data-a="cat" data-c="${c}">${c}</button>`).join("")}</div><div id="ls" class="grid">${lst()}</div></div><button class="fab" data-a="sell">${ic("plus",18)} Jual</button>`;
V.detail=()=>{const i=item(S.sel);if(!i)return hd("Barang tidak ditemukan","","home");const own=S.user&&i.s===S.user.email;return hd(esc(i.n),"","home")+`<div class="gal">${i.ph.length?i.ph.map(p=>`<img src="${p}" alt="">`).join(""):`<div class="img" style="min-width:100%">${ic(CI[i.c]||"box",64)}</div>`}</div>${i.vid?`<video controls playsinline src="${i.vid}" style="width:100%;margin-top:8px"></video>`:""}<div class="pad"><div class="price" style="font-size:22px">${rp(i.p)}${i.sold?" (terjual)":""}</div><div><span class="tag">${esc(i.k)}</span><span class="tag">${i.neg?"Bisa nego":"Harga pas"}</span><span class="tag">${DLV[i.dl]}</span></div><p>${esc(i.d)}</p><div class="mu">${esc(i.lb)} · ${fd(dm(i))} dari lokasimu</div><div class="box row"><div class="av">${esc(i.sn[0])}</div><div><b style="font-weight:500">${esc(i.sn)}</b> <span class="tag">Terverifikasi</span></div></div>${own?`${isF(i)?`<div class="box">Iklanmu sedang dipromosikan</div>`:`<button class="btn" style="width:100%;margin-top:12px" data-a="promo" data-id="${i.id}">Promosikan iklan · ${rp(PROMO)}</button>`}<button class="btn o" style="width:100%;margin-top:8px" data-a="del" data-id="${i.id}">Hapus barang</button>`:`<div class="row" style="margin-top:12px"><button class="btn o" style="flex:1" data-a="chat" data-id="${i.id}">Chat penjual</button><button class="btn o" data-a="fav" data-id="${i.id}" aria-label="Favorit">${ic("heart",18,S.wish.includes(i.id))}</button></div>${i.sold?"":`<div class="row" style="margin-top:8px"><button class="btn o" style="flex:1" data-a="cart" data-id="${i.id}">+ Keranjang</button><button class="btn" style="flex:1" data-a="buy" data-id="${i.id}">Beli sekarang</button></div>`}<button class="lnk" data-a="rep" data-id="${i.id}">Laporkan barang ini</button>`}</div>`};
V.wish=()=>{const l=S.wish.map(item).filter(Boolean);return hd("Favorit")+`<div class="pad"><div class="grid">${l.length?l.map(card).join(""):`<p class="mu">Belum ada favorit.</p>`}</div></div>`};
const cart=()=>S.cart.map(item).filter(i=>i&&!i.sold);
const quote=()=>{const l=cart(),sub=l.reduce((a,i)=>a+i.p,0),far=Math.max(0,...l.map(dm)),sh=S.co.dm==="ship"&&l.length?shipCost(far/1000):0,fee=Math.round(sub*SF);return{l,sub,far,sh,fee,tot:sub+fee+sh}};
const sumK=k=>S.rev.filter(r=>r.k===k).reduce((a,r)=>a+r.a,0);
V.cart=()=>{const l=cart(),t=l.reduce((a,i)=>a+i.p,0);return hd("Keranjang")+`<div class="pad">${l.length?l.map(i=>`<div class="box row"><div style="flex:1"><div>${esc(i.n)}</div><div class="price">${rp(i.p)}</div></div><button class="btn o s" data-a="rm" data-id="${i.id}">Hapus</button></div>`).join("")+`<div class="box row" style="justify-content:space-between"><span>Subtotal</span><b class="price">${rp(t)}</b></div><button class="btn" style="width:100%;margin-top:12px" data-a="co">Checkout</button>`:`<p class="mu">Keranjang kosong.</p>`}</div>`};

V.sell=()=>`${hd("Jual barang","Isi lengkap supaya cepat laku","me")}<div class="pad"><label for="fn">Nama barang</label><input class="f" id="fn"><label for="fc">Kategori</label><select class="f" id="fc">${opt(CAT.slice(1))}</select><label for="fk">Kondisi</label><select class="f" id="fk">${opt(KD,"Baik")}</select><label for="fp">Harga (Rp)</label><input class="f" id="fp" type="number" min="1000" step="1000"><label class="opt"><input type="checkbox" id="fg"> Harga bisa nego</label><label for="fd">Deskripsi kondisi barang</label><textarea class="f" id="fd" rows="3" placeholder="Pemakaian, kekurangan, kelengkapan"></textarea><label for="fl">Lokasi barang</label><input class="f" id="fl" placeholder="Nama kos, jalan, atau kawasan" value="${esc(S.sl?S.sl.lb:"")}"><div class="row" style="margin-top:6px"><button class="btn o s" data-a="sgeo">Cari lokasi</button><button class="btn o s" data-a="sgps">Pakai GPS</button></div><div class="mu" id="ll">${S.sl?"Lokasi terpilih: "+esc(S.sl.lb):"Lokasi belum dipilih"}</div><label for="fx">Pengiriman</label><select class="f" id="fx">${opt([["pickup","Diambil sendiri"],["ship","Dikirim"],["both","Keduanya"]],"both")}</select><label for="fph">Foto (wajib, maks. 5)</label><input class="f" id="fph" type="file" accept="image/*" multiple><label for="fvd">Video (opsional, maks. 30 MB)</label><input class="f" id="fvd" type="file" accept="video/*"><div id="pv"></div><label class="opt"><input type="checkbox" id="fpm"> Promosikan iklan (${rp(PROMO)}, 7 hari, tampil menonjol di beranda)</label><div class="box mu">Pembeli membayar biaya layanan 10%, jadi harga jualmu tetap utuh.</div><div class="err" id="err" role="alert"></div><button class="btn" style="width:100%" data-a="post">Pasang iklan</button></div>`;
V.promo=()=>{const i=item(S.pr);if(!i)return hd("Promosi","","me");return hd("Promosikan iklan","Tampil paling menonjol di beranda","me")+`<div class="pad"><div class="box"><b>${esc(i.n)}</b><div class="mu">Featured listing selama 7 hari</div><div class="price" style="font-size:22px">${rp(PROMO)}</div></div><div class="box mu">Transfer ke BCA 1234567890 a.n. KOSLING Demo. Iklan langsung naik ke atas beranda setelah pembayaran.</div><button class="btn" style="width:100%;margin-top:12px" data-a="paypromo">Saya sudah transfer (demo)</button></div>`};
V.me=()=>{if(!S.user){const r=S.am==="reg";return hd(r?"Daftar akun":"Masuk","Akun diperlukan untuk jual, beli, chat, dan favorit")+`<div class="pad">${r?`<label for="an">Nama</label><input class="f" id="an">`:""}<label for="ae">Email</label><input class="f" id="ae" type="email"><label for="ap">Kata sandi (min. 6 karakter)</label><input class="f" id="ap" type="password"><div class="err" id="err" role="alert"></div><button class="btn" style="width:100%" data-a="auth">${r?"Daftar":"Masuk"}</button><button class="lnk" data-a="am">${r?"Sudah punya akun? Masuk":"Belum punya akun? Daftar"}</button><p class="mu">Mode demo: data hanya tersimpan di browser ini.</p></div>`}const my=S.items.filter(i=>i.s===S.user.email),cl=S.compl.filter(c=>c.by===S.user.email);return hd(esc(S.user.name),esc(S.user.email))+`<div class="pad"><div class="row"><button class="btn" style="flex:1" data-a="sell">Jual barang</button><button class="btn o" style="flex:1" data-a="ord">Pesanan</button></div><h2>Barang saya</h2>${my.length?my.map(i=>`<div class="box row"><div style="flex:1"><div>${esc(i.n)}${i.sold?" (terjual)":""}</div><div class="price">${rp(i.p)}</div></div>${!i.sold&&!isF(i)?`<button class="btn s" data-a="promo" data-id="${i.id}">Promo</button>`:""}<button class="btn o s" data-a="del" data-id="${i.id}">Hapus</button></div>`).join(""):`<p class="mu">Belum ada.</p>`}<h2>Aduan saya</h2>${cl.length?cl.map(c=>`<div class="box"><b style="font-weight:500">${esc(c.n)}</b> <span class="tag">${esc(c.r)}</span><div class="mu">${esc(c.x)}</div></div>`).join(""):`<p class="mu">Belum ada.</p>`}<h2>Pendapatan KOSLING (demo)</h2><div class="box">${[["fee","Biaya layanan 10%"],["feat","Featured listing"],["ship","Komisi pickup &amp; pengiriman 5%"]].map(([k,l])=>`<div class="row" style="justify-content:space-between"><span>${l}</span><b>${rp(sumK(k))}</b></div>`).join("")}<div class="row" style="justify-content:space-between;border-top:1px dashed var(--bd);margin-top:6px;padding-top:6px"><b>Total</b><b class="price">${rp(sumK("fee")+sumK("feat")+sumK("ship"))}</b></div></div><div class="mu">Ringkasan ini untuk peragaan model bisnis ke juri.</div><button class="btn o" style="width:100%;margin-top:16px" data-a="out">Keluar</button></div>`};
const NV={detail:"home",co:"cart",chat:"chats",orders:"me",sell:"me",rep:"me",promo:"me"},NEED=["cart","chats","wish","orders","sell","co","rep","chat","promo"];
function pv(){const e=$("pv");if(e)e.innerHTML=S.photos.map((p,k)=>`<span class="th"><img src="${p}" alt=""><button data-a="rp" data-k="${k}" aria-label="Hapus foto">×</button></span>`).join("")+(S.vid?`<span class="tag">Video dipilih</span>`:"")}
function addPh(f){if(!f.type.startsWith("image/"))return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*m;c.height=im.height*m;c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.photos.push(c.toDataURL("image/jpeg",.7));pv()};im.src=r.result};r.readAsDataURL(f)}
function render(){app.innerHTML=V[S.v]();const n=NV[S.v]||S.v;$("nv").innerHTML=[["home","home","Beranda"],["wish","heart","Favorit"],["cart","cart","Keranjang"],["chats","chat","Chat"],["me","user","Akun"]].map(([v,e,l])=>`<button data-a="go" data-v="${v}"${v===n?' class="on"':""}><span class="ni">${ic(e,22)}${v==="cart"&&S.cart.length?`<span class="bg">${S.cart.length}</span>`:""}</span>${l}</button>`).join("");if(S.v==="sell"){$("fph").onchange=e=>{[...e.target.files].slice(0,5-S.photos.length).forEach(addPh);e.target.value=""};$("fvd").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>3e7){toast("Video maksimal 30 MB");return}S.vid=URL.createObjectURL(f);pv()};pv()}}
function go(v){if(NEED.includes(v)&&!S.user){toast("Masuk atau daftar dulu");v="me"}S.v=v;render();scrollTo(0,0)}
const need=()=>{if(S.user)return 0;toast("Masuk atau daftar dulu");go("me");return 1};
const geoQ=async q=>{const m=q.match(/^\s*(-?\d+(?:[.,]\d+)?)\s*[,;]\s*(-?\d+(?:[.,]\d+)?)\s*$/);if(m)return{la:+m[1].replace(",","."),lo:+m[2].replace(",","."),lb:q.trim()};try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=id&q="+encodeURIComponent(q)),j=await r.json();return j[0]?{la:+j[0].lat,lo:+j[0].lon,lb:q.trim()}:null}catch(e){return null}};
const gps=()=>new Promise(ok=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok({la:p.coords.latitude,lo:p.coords.longitude,lb:"Lokasi saya (GPS)"}),()=>ok(null),{enableHighAccuracy:true,timeout:15000,maximumAge:0}):ok(null));
const DEF={la:-6.9932,lo:110.4203};
const noGps="Lokasi tidak bisa diakses. Izinkan GPS atau isi manual.";
function reply(id){setTimeout(()=>{const m=S.chats[id];if(!m)return;m.push({f:"them",t:"Halo, terima kasih sudah menghubungi. Silakan atur waktu dan tempat ya."});save();if(S.v==="chat"&&S.ch===id)render()},1200)}
function say(t){if(!t.trim())return;(S.chats[S.ch]=S.chats[S.ch]||[]).push({f:"me",t:t.trim()});save();render();reply(S.ch)}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,id=+el.dataset.id,g=x=>$(x).value,er=t=>{$("err").textContent=t};
switch(a){
case"go":go(el.dataset.v);break;
case"open":S.sel=id;go("detail");break;
case"cat":S.cat=el.dataset.c;render();break;
case"fav":if(need())break;S.wish=S.wish.includes(id)?S.wish.filter(x=>x!==id):[...S.wish,id];save();render();break;
case"cart":if(need())break;if(!S.cart.includes(id))S.cart.push(id);save();render();toast("Masuk keranjang");break;
case"buy":if(need())break;if(!S.cart.includes(id))S.cart.push(id);save();go("co");break;
case"rm":S.cart=S.cart.filter(x=>x!==id);save();render();break;
case"co":go("co");break;
case"pay":{const l=cart();if(!l.length)return er("Keranjang kosong.");if(S.co.dm==="ship"&&!S.co.addr.trim())return er("Isi alamat pengiriman.");if(S.co.dm==="ship"&&l.some(i=>i.dl==="pickup"))return er("Ada barang yang hanya bisa diambil sendiri.");if(S.co.dm==="pickup"&&l.some(i=>i.dl==="ship"))return er("Ada barang yang hanya bisa dikirim.");
const q=quote(),dt=new Date().toLocaleDateString("id-ID");S.rev.push({k:"fee",a:q.fee,t:dt});if(q.sh)S.rev.push({k:"ship",a:Math.round(q.sh*PICK),t:dt});S.orders.unshift({id:Date.now(),by:S.user.email,it:l.map(i=>({id:i.id,n:i.n,p:i.p})),sub:q.sub,fee:q.fee,sh:q.sh,tot:q.tot,dm:S.co.dm,pay:S.co.pay,addr:S.co.addr,st:0,t:new Date().toLocaleDateString("id-ID")});l.forEach(i=>i.sold=true);S.cart=[];save();toast("Pesanan dibuat");go("orders");break}
case"ord":go("orders");break;
case"adv":{const o=S.orders.find(x=>x.id===id);if(o&&o.st<2)o.st++;save();render();break}
case"chat":{if(need())break;const i=item(id);if(i.s===S.user.email){toast("Ini barangmu sendiri");break}S.ch=id;S.chats[id]=S.chats[id]||[];go("chat");break}
case"ch":S.ch=id;go("chat");break;
case"send":{const b=$("cm");say(b.value);break}
case"quick":say(el.dataset.t);break;
case"rep":S.cr=id;go("rep");break;
case"sendrep":{const x=g("rx").trim();if(x.length<10)return er("Jelaskan aduan minimal 10 karakter.");S.compl.unshift({by:S.user.email,n:item(S.cr).n,r:g("rr"),x});save();toast("Aduan terkirim. Tim KOSLING akan meninjau");go("me");break}
case"sell":if(need())break;go("sell");break;
case"rp":S.photos.splice(+el.dataset.k,1);pv();break;
case"post":{const n=g("fn").trim(),p=+g("fp"),d=g("fd").trim();if(!n)return er("Isi nama barang.");if(!(p>=1000))return er("Isi harga minimal Rp1.000.");if(d.length<10)return er("Deskripsi kondisi minimal 10 karakter.");if(!S.photos.length)return er("Tambahkan minimal 1 foto.");{const t=g("fl").trim();if(!t)return er("Isi lokasi barang.");if(!S.sl||S.sl.lb!==t)S.sl={la:DEF.la,lo:DEF.lo,lb:t}}
const nid=Math.max(0,...S.items.map(x=>x.id))+1;S.items.unshift({id:nid,n,c:g("fc"),k:g("fk"),p,neg:$("fg").checked?1:0,d,la:S.sl.la,lo:S.sl.lo,lb:S.sl.lb,dl:g("fx"),sn:S.user.name,s:S.user.email,ph:S.photos,vid:S.vid});S.photos=[];S.vid=null;S.sl=null;save();toast("Iklan terpasang");if($("fpm").checked){S.pr=nid;go("promo")}else go("me");break}
case"del":if(confirm("Hapus barang ini?")){S.items=S.items.filter(x=>x.id!==id);S.cart=S.cart.filter(x=>x!==id);S.wish=S.wish.filter(x=>x!==id);save();toast("Barang dihapus");go(S.v==="detail"?"home":S.v)}break;
case"am":S.am=S.am==="reg"?"login":"reg";render();break;
case"auth":{const em=g("ae").trim().toLowerCase(),pw=g("ap");if(!/^\S+@\S+\.\S+$/.test(em))return er("Email tidak valid.");if(pw.length<6)return er("Kata sandi minimal 6 karakter.");
if(S.am==="reg"){const nm=g("an").trim();if(!nm)return er("Isi nama.");if(S.users.some(u=>u.email===em))return er("Email sudah terdaftar.");const u={name:nm,email:em,pw};S.users.push(u);S.user=u}else{const u=S.users.find(x=>x.email===em&&x.pw===pw);if(!u)return er("Email atau kata sandi salah.");S.user=u}save();toast("Selamat datang, "+S.user.name);go("home");break}
case"gps":toast("Mengaktifkan GPS... izinkan akses lokasi di perangkatmu");gps().then(o=>{S.loc=o||{la:DEF.la,lo:DEF.lo,lb:"Lokasi saya"};save();render();toast("Lokasi saya diatur")});break;
case"man":S.man=!S.man;render();break;
case"geo":{const q=g("ml").trim();if(!q)return toast("Ketik lokasinya dulu");S.loc={la:DEF.la,lo:DEF.lo,lb:q};S.man=false;save();render();toast("Lokasi diatur: "+q);geoQ(q).then(o=>{if(o&&S.loc.lb===q){S.loc=o;save();if(S.v==="home"&&!/INPUT|SELECT/.test((document.activeElement||{}).tagName||""))render()}});break}
case"sgps":toast("Mengaktifkan GPS... izinkan akses lokasi di perangkatmu");gps().then(o=>{o=o||{la:DEF.la,lo:DEF.lo,lb:"Lokasi saya"};S.sl=o;const e=$("ll"),f=$("fl");if(e)e.textContent="Lokasi terpilih: "+o.lb;if(f)f.value=o.lb});break;
case"sgeo":{const q=g("fl").trim();if(!q)return toast("Ketik lokasi barang");S.sl={la:DEF.la,lo:DEF.lo,lb:q};$("ll").textContent="Lokasi terpilih: "+q;geoQ(q).then(o=>{if(o&&S.sl&&S.sl.lb===q)S.sl=o});break}
case"promo":S.pr=id;go("promo");break;
case"paypromo":{const i=item(S.pr);if(i){i.feat=Date.now()+6048e5;S.rev.push({k:"feat",a:PROMO,t:new Date().toLocaleDateString("id-ID")});save();toast("Iklanmu sekarang tampil menonjol ")}go("home");break}
case"out":S.user=null;save();go("home");break}});
