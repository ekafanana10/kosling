<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOSLING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--t:#17A89B;--td:#0E7C72;--tl:#E3F6F3;--bg:#fff;--card:#fff;--tx:#1F2D2B;--mu:#5F7370;--bd:#D3E6E3;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A19;--card:#16302D;--tx:#E6F4F2;--mu:#9DBDB9;--bd:#24504B;--tl:#173B37;--td:#5FD3C6}}
:root[data-theme="dark"]{--bg:#0F1A19;--card:#16302D;--tx:#E6F4F2;--mu:#9DBDB9;--bd:#24504B;--tl:#173B37;--td:#5FD3C6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:76px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.top{background:var(--t);color:#fff;padding:16px 16px 18px}
.top small{opacity:.9;display:block}
.top b{font-weight:500;font-size:15px}
.search{margin-top:12px;display:flex;background:#fff;border-radius:10px;padding:0 12px}
.search input{flex:1;border:0;outline:0;padding:11px 0;background:transparent;color:#1F2D2B}
.pad{padding:14px 16px}
h2{font-size:15px;font-weight:500;margin:16px 0 8px}
.promo{background:var(--tl);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center}
.promo b{color:var(--td);font-weight:500}
.promo p{margin:2px 0 0;font-size:12px;color:var(--mu)}
.btn{background:var(--t);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:500}
.btn.o{background:transparent;color:var(--td);border:1px solid var(--t)}
.btn.s{padding:7px 12px;border-radius:8px;font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 14px;font-size:12px}
.chip.on{background:var(--t);color:#fff;border-color:var(--t)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;text-align:left;padding:0;width:100%;display:block}
.img{height:84px;background:var(--tl);color:var(--td);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px}
.img svg{height:100%;width:auto}
.card div.b{padding:8px 10px}
.price{color:var(--td);font-weight:700}
.mu{color:var(--mu);font-size:12px}
.tag{display:inline-block;background:var(--tl);color:var(--td);border-radius:20px;padding:2px 10px;font-size:11px;margin-right:6px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:var(--bg);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--mu)}
.nav button.on{color:var(--td);font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--t);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500}
.box{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--card)}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px}
input.f,select.f{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:var(--card)}
.sw{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.err{color:#C0392B;font-size:12px;margin-top:6px;min-height:16px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--td);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.back{background:none;border:0;color:#fff;font-size:14px;padding:0 0 8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<nav class="nav" aria-label="Menu utama">
<button data-tab="home">Beranda</button><button data-tab="bundle">Kos Bundle</button><button data-tab="sell">Jual</button>
</nav>
<script>
var items=[
{id:1,n:"Kasur busa single",c:"Kasur",p:250000,d:350,s:"Rani A.",r:4.9,k:"Baik",pu:1,b:1},
{id:2,n:"Kipas angin berdiri",c:"Kipas",p:90000,d:600,s:"Dimas P.",r:4.7,k:"Baik",pu:1,b:1},
{id:3,n:"Meja belajar lipat",c:"Meja",p:75000,d:800,s:"Salsa N.",r:4.8,k:"Seperti baru",pu:0,b:1},
{id:4,n:"Rak buku 4 susun",c:"Rak",p:120000,d:1200,s:"Yoga W.",r:4.6,k:"Baik",pu:1,b:0},
{id:5,n:"Rice cooker mini",c:"Elektronik",p:65000,d:450,s:"Nabila F.",r:5,k:"Seperti baru",pu:1,b:0},
{id:6,n:"Kursi plastik",c:"Meja",p:35000,d:900,s:"Rafi H.",r:4.5,k:"Cukup baik",pu:0,b:0}
];
var st={tab:"home",cat:"Semua",q:"",sel:null,nid:7};
var cats=["Semua","Kasur","Meja","Kipas","Rak","Elektronik"];
var app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function rp(n){return "Rp"+Number(n).toLocaleString("id-ID")}
function dist(m){return m<1000?m+" m":(m/1000).toFixed(1).replace(".",",")+" km"}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove("show")},2000)}
function art(i){
var a={
Kasur:'<rect x="14" y="44" width="92" height="16" rx="4" fill="#17A89B"/><rect x="14" y="36" width="92" height="12" rx="5" fill="#9FE1D8"/><rect x="18" y="28" width="26" height="12" rx="5" fill="#fff"/><rect x="10" y="30" width="6" height="40" rx="2" fill="#0E7C72"/><rect x="104" y="42" width="6" height="28" rx="2" fill="#0E7C72"/>',
Kipas:'<circle cx="60" cy="32" r="22" fill="#fff" stroke="#0E7C72" stroke-width="3"/><g fill="#17A89B"><ellipse cx="60" cy="22" rx="5" ry="9"/><ellipse cx="60" cy="22" rx="5" ry="9" transform="rotate(120 60 32)"/><ellipse cx="60" cy="22" rx="5" ry="9" transform="rotate(240 60 32)"/></g><circle cx="60" cy="32" r="4" fill="#0E7C72"/><rect x="58" y="54" width="4" height="18" fill="#0E7C72"/><ellipse cx="60" cy="74" rx="18" ry="4" fill="#0E7C72"/>',
Meja:'<rect x="14" y="32" width="92" height="9" rx="3" fill="#17A89B"/><rect x="20" y="41" width="6" height="32" fill="#0E7C72"/><rect x="94" y="41" width="6" height="32" fill="#0E7C72"/><rect x="60" y="41" width="30" height="14" rx="2" fill="#9FE1D8"/>',
Kursi:'<rect x="36" y="12" width="34" height="30" rx="4" fill="#17A89B"/><rect x="30" y="42" width="52" height="9" rx="3" fill="#0E7C72"/><rect x="34" y="51" width="5" height="22" fill="#0E7C72"/><rect x="73" y="51" width="5" height="22" fill="#0E7C72"/>',
Rak:'<rect x="30" y="10" width="60" height="66" rx="3" fill="none" stroke="#0E7C72" stroke-width="4"/><g fill="#0E7C72"><rect x="30" y="30" width="60" height="4"/><rect x="30" y="50" width="60" height="4"/></g><g fill="#17A89B"><rect x="38" y="16" width="6" height="14"/><rect x="47" y="19" width="6" height="11"/><rect x="58" y="36" width="8" height="14"/><rect x="40" y="56" width="10" height="16"/></g>',
Elektronik:'<rect x="30" y="38" width="60" height="34" rx="8" fill="#17A89B"/><path d="M30 42 Q60 4 90 42 Z" fill="#9FE1D8"/><rect x="54" y="14" width="12" height="5" rx="2" fill="#0E7C72"/><circle cx="60" cy="56" r="5" fill="#fff"/>'
};
var k=i.n.indexOf("Kursi")===0?"Kursi":i.c;
return '<svg viewBox="0 0 120 84" role="img" aria-label="'+esc(i.n)+'">'+(a[k]||a.Meja)+'</svg>'
}
function cardH(i){return '<button class="card" data-id="'+i.id+'"><div class="img">'+art(i)+'</div><div class="b"><div>'+esc(i.n)+'</div><div class="price">'+rp(i.p)+'</div><div class="mu">'+dist(i.d)+'</div></div></button>'}
function home(){
var list=items.filter(function(i){return (st.cat==="Semua"||i.c===st.cat)&&i.n.toLowerCase().indexOf(st.q.toLowerCase())>-1}).sort(function(a,b){return a.d-b.d});
return '<div class="top"><small>Lokasi kamu</small><b>Tembalang, Semarang</b><div class="search"><input id="q" placeholder="Cari kasur, kipas, meja" aria-label="Cari barang" value="'+esc(st.q)+'"></div></div>'+
'<div class="pad"><div class="promo"><div style="flex:1"><b>Jual Cepat Sebelum Pulang</b><p>Barang kos laku sebelum kamu pindah</p></div><button class="btn s" data-go="sell">Jual</button></div>'+
'<h2>Kategori</h2><div class="chips">'+cats.map(function(c){return '<button class="chip'+(c===st.cat?' on':'')+'" data-cat="'+c+'">'+c+'</button>'}).join("")+'</div>'+
'<h2>Terdekat dari kamu</h2>'+(list.length?'<div class="grid">'+list.map(cardH).join("")+'</div>':'<p class="mu">Belum ada barang yang cocok. Coba kata kunci lain.</p>')+'</div>'
}
function detail(){
var i=items.filter(function(x){return x.id===st.sel})[0];
return '<div class="top"><button class="back" data-go="home">Kembali</button><div style="font-size:18px;font-weight:500">'+esc(i.n)+'</div></div><div class="img" style="height:160px">'+art(i)+'</div>'+
'<div class="pad"><div class="price" style="font-size:22px">'+rp(i.p)+'</div><div style="margin-top:6px"><span class="tag">Kondisi '+esc(i.k.toLowerCase())+'</span><span class="tag">'+dist(i.d)+' dari kamu</span></div>'+
'<div class="box row"><div class="av">'+esc(i.s.charAt(0))+'</div><div><b style="font-weight:500">'+esc(i.s)+'</b> <span class="tag">Terverifikasi</span><div class="mu">Mahasiswa aktif, rating '+String(i.r).replace(".",",")+'</div></div></div>'+
'<div class="box mu">'+(i.pu?'Pickup ojek online tersedia, ongkir mulai Rp8.000.':'Ambil langsung di lokasi penjual.')+'</div>'+
'<div class="row" style="margin-top:14px"><button class="btn o" style="flex:1" data-act="chat">Chat penjual</button><button class="btn" style="flex:1" data-act="buy">Beli sekarang</button></div></div>'
}
function bundle(){
var b=items.filter(function(i){return i.b});var tot=b.reduce(function(a,i){return a+i.p},0);
return '<div class="top"><b style="font-size:18px">Kos Bundle</b><small>Isi kamar lengkap, lebih hemat</small></div><div class="pad"><div class="grid">'+b.map(cardH).join("")+'</div>'+
'<div class="box"><div class="row" style="justify-content:space-between"><span class="mu">Harga satuan</span><span style="text-decoration:line-through" class="mu">'+rp(tot)+'</span></div><div class="row" style="justify-content:space-between"><b style="font-weight:500">Harga bundle (hemat 10%)</b><span class="price">'+rp(Math.round(tot*0.9))+'</span></div></div>'+
'<button class="btn" style="width:100%;margin-top:12px" data-act="bundle">Ambil bundle</button></div>'
}
function sell(){
return '<div class="top"><b style="font-size:18px">Jual cepat sebelum pulang</b><small>Atur tanggal pindah, barangmu diprioritaskan</small></div><div class="pad">'+
'<label for="fn">Nama barang</label><input class="f" id="fn" placeholder="Kasur busa single">'+
'<label for="fc">Kategori</label><select class="f" id="fc">'+cats.slice(1).map(function(c){return '<option>'+c+'</option>'}).join("")+'</select>'+
'<label for="fp">Harga (Rp)</label><input class="f" id="fp" type="number" min="1000" step="1000" placeholder="250000">'+
'<label for="fd">Tanggal meninggalkan kos</label><input class="f" id="fd" type="date">'+
'<div class="sw"><span>Masukkan ke Kos Bundle</span><input type="checkbox" id="fb" checked></div>'+
'<div class="sw"><span>Sediakan pickup ojek online</span><input type="checkbox" id="fu" checked></div>'+
'<div class="err" id="err" role="alert"></div><button class="btn" style="width:100%" data-act="post">Pasang iklan</button></div>'
}
function render(){
var v=st.tab==="detail"?detail():st.tab==="bundle"?bundle():st.tab==="sell"?sell():home();
app.innerHTML=v;
var nt=st.tab==="detail"?"home":st.tab;
document.querySelectorAll(".nav button").forEach(function(b){b.classList.toggle("on",b.dataset.tab===nt)});
var q=document.getElementById("q");
if(q)q.addEventListener("input",function(e){st.q=e.target.value;var p=e.target.selectionStart;render();var n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)});
window.scrollTo(0,0)
}
function go(t){st.tab=t;render()}
document.querySelector(".nav").addEventListener("click",function(e){var t=e.target.dataset.tab;if(t)go(t)});
app.addEventListener("click",function(e){
var el=e.target.closest("[data-id],[data-cat],[data-go],[data-act]");if(!el)return;
if(el.dataset.id){st.sel=+el.dataset.id;go("detail")}
else if(el.dataset.cat){st.cat=el.dataset.cat;render()}
else if(el.dataset.go){go(el.dataset.go)}
else if(el.dataset.act==="chat"){toast("Chat dibuka dengan penjual")}
else if(el.dataset.act==="buy"){toast("Pesanan dibuat. Atur pickup atau ambil sendiri")}
else if(el.dataset.act==="bundle"){toast("Bundle ditambahkan ke pesananmu")}
else if(el.dataset.act==="post"){
var n=document.getElementById("fn").value.trim(),p=+document.getElementById("fp").value,d=document.getElementById("fd").value,er=document.getElementById("err");
if(!n){er.textContent="Isi nama barang dulu.";return}
if(!(p>=1000)){er.textContent="Isi harga minimal Rp1.000.";return}
if(!d){er.textContent="Pilih tanggal kamu meninggalkan kos.";return}
items.unshift({id:st.nid++,n:n,c:document.getElementById("fc").value,p:p,d:100,s:"Kamu",r:5,k:"Baik",pu:document.getElementById("fu").checked?1:0,b:document.getElementById("fb").checked?1:0});
st.cat="Semua";st.q="";toast("Iklan terpasang");go("home")}
});
render();
</script>
</body>
</html>
